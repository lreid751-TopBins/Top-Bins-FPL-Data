<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Top Bins — FPL Data Room</title>
<meta name="description" content="Squad tracking, scouting and fixture planning for Fantasy Premier League, from the Top Bins with Twins podcast. Live projections, price-change tracking, and a fixture planner built on real underlying stats." />
<meta name="theme-color" content="#08170e" />
<link rel="canonical" href="https://fpl.topbinswithtwins.com/" />

<!-- Open Graph / Twitter card - text only for now, no share image yet. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Top Bins FPL Data Room" />
<meta property="og:title" content="Top Bins — FPL Data Room" />
<meta property="og:description" content="Squad tracking, scouting and fixture planning for Fantasy Premier League, from the Top Bins with Twins podcast." />
<meta property="og:url" content="https://fpl.topbinswithtwins.com/" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Top Bins — FPL Data Room" />
<meta name="twitter:description" content="Squad tracking, scouting and fixture planning for Fantasy Premier League, from the Top Bins with Twins podcast." />

<!-- Structured data so search engines and AI answer/search agents can
     identify what this site is without having to render the JS app. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Top Bins FPL Data Room",
  "url": "https://fpl.topbinswithtwins.com/",
  "description": "Squad tracking, scouting and fixture planning for Fantasy Premier League, from the Top Bins with Twins podcast.",
  "isPartOf": {
    "@type": "CreativeWorkSeries",
    "name": "Top Bins with Twins",
    "description": "A YouTube/podcast channel covering Fantasy Premier League and USMNT."
  }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="overlay" id="overlay">
  <div class="goalframe" aria-hidden="true">
    <div class="net"></div><div class="post l"></div><div class="post r"></div><div class="post t"></div>
    <div class="ball"></div>
  </div>
  <div>
    <div class="load-txt" id="loadTxt">Warming up the data room</div>
    <div class="load-sub" id="loadSub">Connecting to the FPL API…</div>
  </div>
</div>

<header class="mast">
  <div class="mast-inner">
    <svg class="crest" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M20 2 L36 8 V19 C36 28 29 34.5 20 37 C11 34.5 4 28 4 19 V8 Z" stroke="#c9a227" stroke-width="1.5"/>
      <path d="M20 5.5 L32.5 10.2 V19 C32.5 26.3 27 31.6 20 33.7 C13 31.6 7.5 26.3 7.5 19 V10.2 Z" stroke="#5b8a6e" stroke-width="0.6"/>
      <circle cx="20" cy="17" r="4.4" fill="#ece4d2"/>
      <path d="M20 13.4l1.2 2.5 2.6.3-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.3z" fill="#14120e"/>
    </svg>
    <div class="brand">
      <div class="wm">TOP <b>BINS</b></div>
      <div class="sub">with twins · fpl data room</div>
    </div>

    <div class="mast-spacer"></div>

    <div class="gw-badge" id="gwBadge" hidden>
      <div>
        <div class="lab">Next</div>
        <div class="val" id="gwVal">—</div>
      </div>
      <div class="deadline" id="gwDeadline"></div>
    </div>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusTxt">Loading…</span>
    </div>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" aria-selected="true"  data-tab="hub">Hub</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="squad">My Team</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="scout">Player Finder</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="fixtures">Fixture Ticker</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="teams">Teams</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="planner">Planner</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="analytics">Analytics</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="journal">Journal</button>
</nav>

<main class="wrap">
  <div class="board">
    <section id="panel-hub"      role="tabpanel"></section>
    <section id="panel-squad"    role="tabpanel" hidden></section>
    <section id="panel-scout"    role="tabpanel" hidden></section>
    <section id="panel-fixtures" role="tabpanel" hidden></section>
    <section id="panel-teams"    role="tabpanel" hidden></section>
    <section id="panel-planner"  role="tabpanel" hidden></section>
    <section id="panel-analytics" role="tabpanel" hidden></section>
    <section id="panel-journal"  role="tabpanel" hidden></section>
  </div>
  <p class="foot-discord">
    <a href="https://discord.gg/2SXcY9uv" target="_blank" rel="noopener noreferrer">Join the Top Bins Discord →</a>
  </p>
  <p class="foot-src">
    Live data from the official Fantasy Premier League API. Not affiliated with the Premier League or FPL.
  </p>
</main>

<!-- Player profile drawer: a single shared panel any tab can open by player
     id, rather than each view building its own. Lives outside .board so
     its fixed positioning is never affected by an ancestor's layout. -->
<div class="player-detail-backdrop" id="pdBackdrop" hidden></div>
<aside class="player-detail" id="playerDetail" hidden aria-hidden="true" aria-label="Player profile"></aside>

<!-- Team Rater drawer: same shared-panel pattern as the player profile above. -->
<div class="player-detail-backdrop" id="trBackdrop" hidden></div>
<aside class="player-detail" id="teamRater" hidden aria-hidden="true" aria-label="Team Rater"></aside>

<!-- Written by the Pages workflow. Absent locally, which falls back to /api. -->
<script src="./env.js"></script>
<script type="module" src="./js/app.js"></script>

<!-- Privacy-friendly analytics (GoatCounter): no cookies, no personal data.
     no_onload skips its own automatic pageview - this is a single-page app
     where tabs are JS state, not real URL changes, so app.js fires a
     virtual pageview per tab instead (see trackTab in app.js), which is
     what actually tells us which tabs get used. -->
<script data-goatcounter="https://topbinswithtwins.goatcounter.com/count"
        data-goatcounter-settings='{"no_onload": true}'
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
