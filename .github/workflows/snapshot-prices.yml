name: Snapshot prices

# FPL applies price changes at about 01:30 UTC. This runs afterwards and
# records every player's price for the day, which is the history the API
# itself never gives you.

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Record today's prices
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
        run: |
          test -n "$PROJECT_REF" || { echo "::error::Set the SUPABASE_PROJECT_REF repository variable"; exit 1; }
          test -n "$SNAPSHOT_KEY" || { echo "::error::Set the SNAPSHOT_KEY secret"; exit 1; }
          response=$(curl -fsS --retry 3 --retry-delay 20 -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/fpl/snapshot" \
            -H "x-snapshot-key: ${SNAPSHOT_KEY}")
          echo "$response"
          # The endpoint always returns 200 once prices are stored, even if
          # the #price-changes Discord post failed - that's deliberate (a
          # Discord hiccup shouldn't block recording the prices themselves),
          # but it means curl's own success check can't catch it. Check the
          # response body directly so a swallowed announcement failure still
          # shows up as a red run here instead of a misleadingly green one.
          if [ "$(echo "$response" | jq -r '.announced')" = "false" ]; then
            echo "::error::Prices were recorded, but the #price-changes Discord announcement failed - check the edge function logs."
            exit 1
          fi
