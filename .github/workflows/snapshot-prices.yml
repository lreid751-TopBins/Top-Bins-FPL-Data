name: Snapshot prices

# FPL doesn't confine price changes to a single fixed time - "once around
# 7pm Eastern" (confirmed 27 Aug 2026) turned out not to hold either;
# confirmed 1 Sep 2026 that a second, separate batch of changes landed
# hours after the first. Trying to schedule around a specific time keeps
# getting the timing wrong, so this just polls constantly instead - every
# 5 minutes, GitHub's practical floor for a schedule trigger - and lets the
# endpoint itself figure out whether anything's actually new to report.
# Records every player's price on every run, which is also the history the
# API itself never gives you.
#
# GitHub's own schedule trigger has separately gone missing or landed hours
# late (see CLAUDE.md's cron-skip gotcha) - polling this often means a
# dropped run barely matters, since the next one is 5 minutes away. The
# endpoint tracks exactly which (player, price) pairs it's already
# announced today (handleSnapshot's announcedKey guard), so the other
# ~99% of these runs that find nothing new are silent no-ops, not spam.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Record today's prices
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
        run: |
          test -n "$PROJECT_REF" || { echo "::error::Set the SUPABASE_PROJECT_REF repository variable"; exit 1; }
          test -n "$SNAPSHOT_KEY" || { echo "::error::Set the SNAPSHOT_KEY secret"; exit 1; }
          response=$(curl -fsS --retry 3 --retry-delay 20 -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/fpl/snapshot" \
            -H "x-snapshot-key: ${SNAPSHOT_KEY}")
          echo "$response"
          # The endpoint always returns 200 once prices are stored, even if
          # the #price-changes Discord post failed - that's deliberate (a
          # Discord hiccup shouldn't block recording the prices themselves),
          # but it means curl's own success check can't catch it. Check the
          # response body directly so a swallowed announcement failure still
          # shows up as a red run here instead of a misleadingly green one.
          if [ "$(echo "$response" | jq -r '.announced')" = "false" ]; then
            echo "::error::Prices were recorded, but the #price-changes Discord announcement failed - check the edge function logs."
            exit 1
          fi
