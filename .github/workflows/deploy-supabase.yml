name: Deploy Supabase

# Migrations and the edge function ship together. Anything under supabase/
# triggers a deploy; the tests gate it so a broken handler never reaches prod.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          test -n "$PROJECT_REF" || { echo "::error::Set the SUPABASE_PROJECT_REF repository variable"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Set the SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          # db push authenticates to Postgres with this one. Left unchecked it
          # sailed past this gate and failed two steps later with a connection
          # error that read like a broken migration.
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Set the SUPABASE_DB_PASSWORD secret"; exit 1; }

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test the handler
        run: deno test --no-remote supabase/functions/fpl/handler.test.ts supabase/functions/fpl/rating.test.ts

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest". CLI v3.0.0 (2026-11-02) landed between the
          # Oct 2026 deploy and the next one, and "latest" silently carried
          # this workflow across a major version with two breaking changes to
          # the steps below:
          #   - "local by default": db push targets a local Docker stack unless
          #     you pass --remote. On a runner there is no local stack, so it
          #     fails with ECONNREFUSED on 127.0.0.1:54322.
          #   - hosted mutations need consent: db push AND functions deploy
          #     fail unattended unless you pass --yes.
          # Neither --remote nor the v3 consent behaviour exists in v2, so the
          # pin and the flags below are a matched set -- changing one without
          # the other breaks the deploy. Moving to v3 means pinning a v3
          # release and adding --remote to db push and --yes to both hosted
          # steps, in the same commit.
          version: 2.122.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        run: supabase db push

      - name: Deploy function
        run: supabase functions deploy fpl --project-ref "$PROJECT_REF"
